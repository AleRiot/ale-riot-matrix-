<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALE Riot — 3991</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap');

:root{
  --bg:#06070a;
  --ink:#f2f0eb;
  --muted:#98989b;
  --line:rgba(255,255,255,.14);
  --red:#8f1f25;
  --red2:#c63a40;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif;overflow:hidden}
button,a{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
a{text-decoration:none}

/* ATMOSPHERE */
body:before{
  content:"";position:fixed;inset:-15%;z-index:0;
  background:
    radial-gradient(ellipse at 50% 40%,rgba(180,190,205,.18),transparent 30%),
    radial-gradient(ellipse at 15% 70%,rgba(80,85,100,.15),transparent 32%),
    radial-gradient(ellipse at 85% 25%,rgba(110,115,135,.10),transparent 30%),
    linear-gradient(180deg,#0c1017 0%,#080a0f 45%,#020305 100%);
  filter:blur(2px);
  animation:sky 14s ease-in-out infinite alternate;
}
body:after{
  content:"";position:fixed;inset:0;z-index:3;pointer-events:none;
  background:
    radial-gradient(circle at center,transparent 35%,rgba(0,0,0,.62) 100%),
    linear-gradient(90deg,rgba(0,0,0,.2),transparent 20%,transparent 80%,rgba(0,0,0,.2));
}
@keyframes sky{from{transform:scale(1)}to{transform:scale(1.08) translate3d(0,-1%,0)}}

#particles{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.55}

/* CLOUD-LIKE LAYERS */
.cloud{position:fixed;z-index:1;pointer-events:none;border-radius:50%;filter:blur(35px);opacity:.22}
.cloud.one{width:55vw;height:18vw;left:-8vw;top:16vh;background:#a8adb9;transform:rotate(-8deg);animation:cloud1 16s ease-in-out infinite alternate}
.cloud.two{width:45vw;height:14vw;right:-6vw;top:9vh;background:#737987;transform:rotate(9deg);animation:cloud2 19s ease-in-out infinite alternate}
.cloud.three{width:65vw;height:20vw;left:18vw;bottom:5vh;background:#626876;opacity:.12;animation:cloud3 22s ease-in-out infinite alternate}
@keyframes cloud1{to{transform:translate(8vw,2vh) rotate(-4deg)}}
@keyframes cloud2{to{transform:translate(-7vw,4vh) rotate(13deg)}}
@keyframes cloud3{to{transform:translate(0,-4vh) scale(1.1)}}

/* ENTRY */
#entry{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  background:rgba(3,4,6,.82);backdrop-filter:blur(12px);
  transition:opacity 1.1s ease,visibility 1.1s;
}
#entry.hide{opacity:0;visibility:hidden;pointer-events:none}
.entry-inner{text-align:center;animation:entryIn 1.4s ease both}
.entry-kicker{font-size:9px;letter-spacing:6px;color:#777;margin-bottom:24px}
.entry-title{font-family:"Cormorant Garamond",serif;font-size:clamp(52px,9vw,110px);font-weight:500;letter-spacing:.18em;margin:0 0 22px}
.entry-title span{display:block;font-size:.46em;letter-spacing:.65em;color:#aaa;margin-top:7px}
.enter{
  position:relative;padding:13px 28px;border:1px solid var(--line);font-size:9px;letter-spacing:4px;color:#cfcfd1;
  transition:.35s;overflow:hidden
}
.enter:before{content:"";position:absolute;inset:0;background:var(--red);transform:translateX(-105%);transition:.4s;z-index:-1}
.enter:hover{border-color:rgba(255,255,255,.35);letter-spacing:5px}
.enter:hover:before{transform:translateX(0)}
.entry-note{margin-top:14px;font-size:8px;letter-spacing:2px;color:#5e5f63}

/* APP */
.app{position:relative;z-index:10;width:100%;height:100%;opacity:0;transform:scale(1.025);transition:opacity 1.2s ease,transform 1.4s ease}
.app.ready{opacity:1;transform:scale(1)}

.top{
  position:absolute;left:0;right:0;top:0;height:76px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.09);z-index:20
}
.brand{display:flex;align-items:center;gap:16px}
.brand-mark{width:28px;height:28px;border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;font-family:"Cormorant Garamond",serif;font-size:18px}

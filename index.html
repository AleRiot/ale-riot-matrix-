<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALE Riot — 3991</title>
<style>
:root{
 --bg:#06070a;
 --ink:#f2f0eb;
 --red:#c63a40;
 --line:rgba(255,255,255,.14);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06070a;color:var(--ink);font-family:Inter,Arial,sans-serif}
button{background:none;border:0;color:inherit;cursor:pointer}
body:before{
 content:"";position:fixed;inset:-20%;z-index:0;
 background:radial-gradient(circle,rgba(198,58,64,.16),transparent 35%),
 linear-gradient(180deg,#10131b,#020305);
 filter:blur(5px);
 animation:bgmove 12s infinite alternate;
}
@keyframes bgmove{to{transform:scale(1.1)}}

#particles{position:fixed;inset:0;z-index:1}

#entry{
 position:fixed;inset:0;z-index:50;
 display:grid;place-items:center;
 background:rgba(2,3,5,.92);
 backdrop-filter:blur(15px);
 transition:1.3s;
}
#entry.hide{opacity:0;visibility:hidden}
.entry-inner{text-align:center;animation:appear 2s}
.entry-title{
 font-family:Georgia,serif;
 font-size:clamp(60px,10vw,130px);
 letter-spacing:.25em;
 margin:0;
 filter:blur(12px);
 animation:title 2s forwards;
}
.entry-title span{display:block;font-size:.42em;letter-spacing:.7em;color:#aaa}
.enter{
 margin-top:40px;padding:15px 35px;
 border:1px solid var(--line);
 letter-spacing:4px;font-size:10px;
}
@keyframes appear{from{opacity:0;transform:scale(1.1)}to{opacity:1}}
@keyframes title{to{filter:blur(0)}}

.app{position:relative;z-index:5;width:100%;height:100%;opacity:0;transition:1s}
.app.ready{opacity:1}

.top{
 height:76px;padding:0 5vw;
 display:flex;align-items:center;
}
.brand{display:flex;gap:15px;align-items:center}
.brand-mark{border:1px solid #777;padding:8px}
.brand-name{letter-spacing:4px;font-size:12px}

.side-menu{
 position:fixed;
 right:55px;
 top:50%;
 transform:translateY(-50%);
 z-index:20;
 display:flex;
 flex-direction:column;
 gap:15px;
 padding:20px;
 border:1px solid rgba(255,255,255,.1);
 border-radius:25px;
 background:rgba(10,10,15,.45);
 backdrop-filter:blur(12px);
}
.side-menu button{
 width:120px;
 text-align:left;
 font-size:9px;
 letter-spacing:3px;
 color:#888;
}
.side-menu button.active{color:white}

.viewport{height:calc(100% - 76px)}
.section{
 position:absolute;inset:0;
 padding:7vh 9vw;
 opacity:0;visibility:hidden;
 transform:translateY(25px);
 transition:.8s;
}
.section.active{opacity:1;visibility:visible;transform:none}

.hero h1{
 font-family:Georgia,serif;
 font-size:clamp(70px,12vw,160px);
 margin:0;
}
.hero h1 .last{
 display:block;
 color:transparent;
 -webkit-text-stroke:1px white;
}
.hero-deco{
 position:absolute;right:10%;
 top:50%;
 transform:translateY(-50%);
 width:300px;height:300px;
 border:1px solid rgba(255,255,255,.1);
 border-radius:50%;
 display:grid;place-items:center;
}

.page-head{border-bottom:1px solid var(--line);margin-bottom:30px}
.page-head h2{font-family:Georgia,serif;font-size:50px}

.cards,.gallery,.network{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card,.photo,.social{
 border:1px solid rgba(255,255,255,.1);
 padding:20px;
}
.photo{height:180px}
.photo img{width:100%;height:100%;object-fit:cover}

.audio{
 position:fixed;left:40px;bottom:30px;
 display:flex;gap:10px;align-items:center;
}
.audio button{border:1px solid var(--line);padding:10px}

@media(max-width:800px){
.side-menu{right:15px}
.cards,.gallery,.network{grid-template-columns:1fr}
}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div id="entry">
<div class="entry-inner">
<div>PRIVATE DIGITAL SPACE / 3991</div>
<h1 class="entry-title">ALE <span>RIOT</span></h1>
<button class="enter" id="enter">ENTER EXPERIENCE</button>
</div>
</div>

<div class="app" id="app">
<header class="top">
<div class="brand">
<div class="brand-mark">A</div>
<div class="brand-name">ALE RIOT</div>
</div>
</header>

<div class="side-menu">
<button class="active" data-go="home">01 HISTORIA</button>
<button data-go="gallery">02 GALERÍA</button>
<button data-go="network">03 ALE RIOT</button>
<button data-go="audio">04 AUDIO</button>
</div>

<main class="viewport">
<section class="section active" id="home">
<div class="hero">
<h1>ALE <span class="last">RIOT</span></h1>
<div class="hero-deco">AR</div>
</div>
</section>

<section class="section" id="gallery">
<div class="page-head"><h2>GALERÍA</h2></div>
<div class="gallery">
<div class="photo"><img src="https://picsum.photos/500/300"></div>
<div class="photo"><img src="https://picsum.photos/501/300"></div>
<div class="photo"><img src="https://picsum.photos/502/300"></div>
</div>
</section>

<section class="section" id="network">
<div class="page-head"><h2>ALE RIOT</h2></div>
<div class="network">
<div class="social">Instagram</div>
<div class="social">TikTok</div>
<div class="social">YouTube</div>
</div>
</section>

<section class="section" id="audio">
<div class="page-head"><h2>AUDIO</h2></div>
<audio controls></audio>
</section>
</main>

<div class="audio">
<button id="mute">II</button>
<span>AMBIENCE</span>
</div>

</div>

<script>
const entry=document.getElementById("entry");
const app=document.getElementById("app");

document.getElementById("enter").onclick=()=>{
 entry.classList.add("hide");
 app.classList.add("ready");
};

const sections=document.querySelectorAll(".section");
const buttons=document.querySelectorAll("[data-go]");

buttons.forEach(b=>{
 b.onclick=()=>{
  sections.forEach(s=>s.classList.toggle("active",s.id===b.dataset.go));
  buttons.forEach(x=>x.classList.toggle("active",x===b));
 };
});

const c=document.getElementById("particles");
const ctx=c.getContext("2d");
let pts=[];
function resize(){
 c.width=innerWidth;c.height=innerHeight;
 pts=Array.from({length:80},()=>({x:Math.random()*c.width,y:Math.random()*c.height}));
}
resize();addEventListener("resize",resize);
function draw(){
 ctx.clearRect(0,0,c.width,c.height);
 ctx.fillStyle="rgba(255,255,255,.35)";
 pts.forEach(p=>{
  p.y-=.2;if(p.y<0)p.y=c.height;
  ctx.fillRect(p.x,p.y,1,1);
 });
 requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050000;
    color:#ff3b3b;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

.vignette{
    position:fixed;
    inset:0;
    background:radial-gradient(circle,transparent 20%,#000 95%);
    pointer-events:none;
}

.scanlines{
    position:fixed;
    inset:0;
    background:linear-gradient(
        transparent 50%,
        rgba(255,0,0,.08) 50%
    );
    background-size:100% 4px;
    pointer-events:none;
}

.panel{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    z-index:5;
    padding:40px;
    border:1px solid rgba(255,50,50,.4);
    background:rgba(0,0,0,.45);
    box-shadow:0 0 40px red;
}

h1{
    font-size:50px;
    letter-spacing:10px;
    text-shadow:0 0 20px red;
}

p{
    font-size:18px;
    color:#ffaaaa;
}

button{
    margin-top:20px;
    padding:15px 30px;
    background:#900;
    color:white;
    border:1px solid red;
    cursor:pointer;
    font-size:18px;
    box-shadow:0 0 20px red;
}

button:hover{
    background:red;
}
    @keyframes pulse{

    0%{
        box-shadow:0 0 40px red;
        transform:translate(-50%,-50%) scale(1);
    }

    50%{
        box-shadow:0 0 80px #ff0000;
        transform:translate(-50%,-50%) scale(1.05);
    }

    100%{
        box-shadow:0 0 40px red;
        transform:translate(-50%,-50%) scale(1);

<body>

<canvas id="matrix"></canvas>

<h1>ALE RIOT</h1>
<p>MATRIX RED SYSTEM</p>
<button onclick="activar()">ACTIVAR</button>

<script>
  const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

let width;
let height;
let columns = [];
let fontSize = 18;

const chars = "ｱｲｳｴｵｶｷｸｹｺ0123456789<>/#@ALE RIOT 3991";

function resize(){

    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    columns = [];

    let count = Math.floor(width / fontSize);

    for(let i = 0; i < count; i++){

        columns.push({
            x:i * fontSize,
            y:Math.random() * height,
            speed:0.8 + Math.random() * 1.2
        });

    }
}

window.addEventListener("resize",resize);

resize();


function drawMatrix(){

    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.fillRect(0,0,width,height);


    ctx.font = fontSize+"px Courier New";


    columns.forEach(col=>{

        let text = chars.charAt(
            Math.floor(Math.random()*chars.length)
        );


        ctx.fillStyle="#ff1616";
        ctx.shadowColor="#ff4444";
        ctx.shadowBlur=15;


        ctx.fillText(
            text,
            col.x,
            col.y
        );


        col.y += col.speed;


        if(col.y > height){

            col.y = 0;

        }

    });


    requestAnimationFrame(drawMatrix);

}


drawMatrix();



function activar(){

    const panel = document.querySelector(".panel");
    const button = document.querySelector("button");
    const title = document.querySelector("h1");
    const text = document.querySelector("p");

    button.innerHTML = "INICIANDO...";

    title.innerHTML = "ACCESS GRANTED";
    text.innerHTML = "INITIALIZING ALE RIOT 3991...";

    setTimeout(()=>{
        text.innerHTML = "LOADING MATRIX CORE...";
    },1200);

    setTimeout(()=>{
        text.innerHTML = "CONNECTING NODE 3991...";
    },2400);

    setTimeout(()=>{
        title.innerHTML = "SYSTEM ONLINE";
        text.innerHTML = "WELCOME TO ALE RIOT MATRIX";

        button.innerHTML = "ENTER";
        button.disabled = false;

        button.onclick = abrirMatrixMenu;

                        </a>


                        <a

            </main>


            <footer class="matrix-footer">

                <span>
                    SYSTEM ONLINE

        `;


        if(!document.getElementById("matrix-modern-style")){

            const style = document.createElement("style");

        function mostrarSeccion(nombre){

            navButtons.forEach(btn=>{

                btn.classList.toggle(
                    "active",
                    btn.dataset.section === nombre
                );

            });


            sections.forEach(section=>{

                section.classList.toggle(
                    "active",
                    section.id ===
                    "section-" + nombre
                );

            });
